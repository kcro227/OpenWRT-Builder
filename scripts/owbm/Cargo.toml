[package]
name = "owbm"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
colored = "2.1"
dialoguer = "0.11"
serde_json = "1.0"
walkdir = "2.5"
ctrlc = "3.4"
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.28", features = ["signal", "process"] }
anyhow = "1.0"
thiserror = "1.0"
